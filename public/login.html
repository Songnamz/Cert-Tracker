<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cert Tracker — Sign In</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
  <link rel="stylesheet" href="login.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="login-bg"></div>

  <div class="login-wrap">
    <div class="login-card">

      <!-- Logo -->
      <div class="login-logo">🔒</div>
      <h1 class="login-title">Cert Tracker</h1>
      <p class="login-subtitle">SSL Certificate Expiry Dashboard</p>

      <div class="login-step" id="step-google">
        <p class="step-label" style="text-align: center;">Sign in with your Google account to continue</p>
        <div id="google-btn-container" style="display: flex; justify-content: center; margin-top: 20px; margin-bottom: 20px; min-height: 40px;"></div>
      </div>

      <!-- Error / success message -->
      <div class="login-msg hidden" id="login-msg"></div>

    </div>

    <p class="login-footer">&copy; <span id="login-year"></span> Songnam Saraphai</p>
  </div>

  <script src="login.js"></script>
</body>
</html>
